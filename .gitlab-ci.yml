stages:
  - build
  - test
  - deploy

build_image:
  stage: build
  tags:
    - shell
  script:
    - docker build -t digimarket:latest .

test_api:
  stage: test
  tags:
    - shell
  script:
    - docker run --rm --entrypoint sh -v "$CI_PROJECT_DIR/tests:/app/tests:ro" digimarket:latest -c "pip install --no-cache-dir pytest && python -m pytest -v tests/"

deploy_api:
  stage: deploy
  tags:
    - shell
  script:
    - docker rm -f digimarket-api || true
    - docker run -d --name digimarket-api -p 5000:5000 -v digimarket-data:/app/instance -e SECRET_KEY -e JWT_SECRET_KEY digimarket:latest